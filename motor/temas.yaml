  regulacion:
    descripcion: >
      Noticias sobre leyes, decretos, regulaciones y decisiones de instituciones del
      Estado panameño: Asamblea Nacional, nuevas leyes, reglamentos y fallos judiciales.
    semillas:
      - Asamblea Nacional
      - proyecto de ley
      - decreto ejecutivo
      - reglamento
      - Corte Suprema de Justicia
      - fallo judicial
      - nueva ley
      - reforma legal
      - normativa
      - Gaceta Oficial
      - Contraloría General
      - marco regulatorio

# Grupos de contraste (no son temas del reto): representan los grandes bloques de
# noticias reales que NO son ninguno de los 6 temas de arriba (deportes, sucesos
# policiales, política general, espectáculos, salud y educación genéricas, conflictos
# internacionales ajenos a Panamá, clima cotidiano sin evento). Se construyen como
# prototipos igual que los temas; si el prototipo más cercano a un titular es uno de
# contraste, el resultado es `otros` y se guarda cuál grupo ganó (columna `contraste`
# de la tabla `clasificacion`) para poder explicarlo en vez de dejar un `otros` mudo.
# Añadidos tras mirar a ojo 30154 titulares reales: sin esto, ruido de deportes/sucesos/
# política terminaba clasificado como un tema del reto por no tener dónde más caer.
contraste:
  deportes:
    descripcion: >
      Noticias deportivas: fútbol, béisbol, boxeo, selección nacional, campeonatos,
      resultados de partidos y lesiones de atletas.
    semillas:
      - selección de Panamá
      - fútbol
      - béisbol
      - boxeo
      - campeonato deportivo
      - liga deportiva
      - gol
      - partido amistoso
      - eliminatoria mundialista
      - atleta
      - entrenador
      - estadio

  sucesos_policiales:
    descripcion: >
      Sucesos y crónica policial: homicidios, robos, detenciones, narcotráfico,
      accidentes de tránsito y operativos de la policía.
    semillas:
      - homicidio
      - robo
      - detenido
      - Policía Nacional
      - narcotráfico
      - droga sintética
      - accidente de tránsito
      - operativo policial
      - ganado robado
      - pandillas
      - arma de fuego
      - fiscalía

  politica_general:
    descripcion: >
      Política partidista y gobierno general no vinculada a una ley o regulación
      concreta: elecciones, partidos, declaraciones de funcionarios, giras oficiales.
    semillas:
      - elecciones
      - partido político
      - candidato presidencial
