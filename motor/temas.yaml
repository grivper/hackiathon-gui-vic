      - encuesta de opinión
      - oposición política
      - gira oficial

  espectaculos_cultura:
    descripcion: >
      Espectáculos, cultura y entretenimiento: conciertos, cine, televisión,
      celebridades, moda y vida de farándula.
    semillas:
      - concierto
      - cantante
      - actor
      - película
      - farándula
      - celebridad
      - festival cultural
      - telenovela
      - moda
      - premios musicales
      - feria artesanal
      - exposición de arte

  salud:
    descripcion: >
      Noticias generales de salud y medicina, sin ser un problema de servicio público
      estatal: enfermedades, tratamientos, investigaciones médicas y casos clínicos.
    semillas:
      - enfermedad
      - brote de dengue
      - vacuna
      - tratamiento médico
      - paciente
      - especialista en salud
      - hospital privado
      - estudio médico
      - salud mental
      - nutrición
      - pandemia
      - covid-19

  educacion:
    descripcion: >
      Noticias generales de educación, sin ser un problema de servicio público
      estatal: universidades, becas, resultados académicos y vida estudiantil.
    semillas:
