- id: DEC-001
  decision: Documentación como código, sincronizada con Notion por API
  fecha: '2026-10-06'
  estado: Vigente
  contexto: El teamspace oficial aún no está asignado y la documentación tiende a quedar para el final
  alternativas: Escribir directamente en Notion; documentar al cierre del evento
  justificacion: La bitácora vive en el repositorio con fecha de cada registro y se sincroniza en cada
    commit. Migrar al teamspace consiste en cambiar el destino y volver a ejecutar la sincronización.
  decidio: Guille
- id: DEC-002
  decision: Modalidad editorial (TVN · principal)
  fecha: '2026-10-06'
  estado: Propuesta
  contexto: El reto admite editorial o bancaria; la editorial es la recomendada
  alternativas: Modalidad bancaria; ambas modalidades
  justificacion: Es la recomendada, TVN es el patrocinador y el reto pide no dispersarse en dos productos
  decidio: Guille
- id: DEC-003
  decision: Base de datos local (DuckDB); Notion solo como bitácora y presentación
  fecha: '2026-10-06'
  estado: Propuesta
  contexto: El documento no exige una base de datos específica y la demo debe funcionar sin internet (T10)
  alternativas: Notion como base de datos; SQLite; PostgreSQL
  justificacion: Un solo archivo, sin servidor y funciona offline. Notion requiere conexión, limita la
    API a unas 3 solicitudes por segundo y no permite búsqueda semántica.
  decidio: Guille
- id: DEC-004
  decision: 'Período de datos: entrenar y probar con cualquier fecha y fuente; demo con datos recientes
    (desde 2025-10-02, fin 2026-09-30 por confirmar)'
  fecha: 2026-10-06T21:19-05:00
  estado: Vigente
  contexto: El PDF se contradice (30 días recientes vs rango [2024-01-01, 2025-10-01)). La organización
    respondió que las fuentes del PDF son ejemplos, que el scraping es general y que las fechas viejas
    valen para entrenar; la demo presencial exige datos recientes.
  alternativas: Aplicar el rango de la sección 7 del PDF tal cual; usar solo los 30 días previos a la
    extracción
  justificacion: Es la respuesta oficial de la organización. GDELT DOC 2.0 solo indexa ~90 días y limita
    a 1 consulta cada 5 s (con 6 s dio 429 desde esta IP, se usa pausa de 10 s).
  decidio: Guille
- id: DEC-005
  decision: Snapshot de datos en git y base DuckDB derivada (make db), idempotente por hash del manifest
  fecha: 2026-10-06T22:12-05:00
  estado: Vigente
  contexto: Los dos integrantes necesitan exactamente los mismos datos sin repetir descargas ni subir
    binarios a git.
  alternativas: Subir el archivo .duckdb a git; que cada uno ejecute make datos y dependa de capturas
    distintas del RSS
  justificacion: El snapshot (CSV, manifest con hash) es pequeño y reproducible; el .duckdb se reconstruye
    igual desde él. Mismo hash de manifest implica mismos datos.
  decidio: Guille
